esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    components:
      - espp/adxl345^1.2.0
      - espp/i2c>=1.0

esphome:
  name: test-position-sensor
  comment: "Test Sensor"
  includes:
    - adxl345_global.h

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 30min

web_server:
  port: 80
  include_internal: true

logger:
  level: DEBUG

sensor:
  - platform: template
    name: "Accel X"
    update_interval: 100ms
    lambda: |-
      adxl_init();
      std::error_code ec;
      auto data = adxl_sensor->read(ec);
      if (ec) return {};
      return data.x;

  - platform: template
    name: "Accel Y"
    update_interval: 100ms
    lambda: |-
      adxl_init();
      std::error_code ec;
      auto data = adxl_sensor->read(ec);
      if (ec) return {};
      return data.y;

  - platform: template
    name: "Accel Z"
    update_interval: 100ms
    lambda: |-
      adxl_init();
      std::error_code ec;
      auto data = adxl_sensor->read(ec);
      if (ec) return {};
      return data.z;